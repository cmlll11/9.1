[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdluap"
version = "0.1.0"
description = "Targeted universal mapping and MDL validation experiment"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "PyYAML>=6,<7",
  "torch>=2.4,<2.5",
  "torchvision>=0.19,<0.20",
]

[tool.setuptools.packages.find]
where = ["src"]
